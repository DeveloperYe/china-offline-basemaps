name: Verify Releases

# 每周体检：确认索引里 370 个城市包的直链仍然可用、字节数一致。
#
# 只发 HEAD 请求（不下载内容），几十秒跑完、零存储成本。
# 一旦某个包丢失 / 被替换 / 仓库转私有导致 403/404，本工作流会变红并自动开 issue，
# 避免等到用户下载失败才发现。
#
# 也可手动触发：Actions → Verify Releases → Run workflow

on:
  schedule:
    # 每周一 03:17 UTC（北京时间 11:17），避开整点拥堵
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: '只抽查前 N 个（0=全量）'
        required: false
        default: '0'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify all release assets
        id: verify
        run: node scripts/verify-releases.mjs "${{ github.event.inputs.limit || '0' }}"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="城市底图包体检失败（$(date -u +%Y-%m-%d)）"
          # 避免重复开 issue：同标题已存在就不再开
          EXISTS=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTS" != "0" ]; then
            echo "已有未关闭的同类 issue，跳过创建"
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "每周自动体检发现异常，详见本次运行日志：
${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

常见原因与处理：
- \`HTTP 404\`：该城市的 Release/资产被删除或被替换过 → 用 \`build-city-tiles.yml\` 按原 source 日期重切（注意源档案只留约 5 天，过期需换新日期并重新生成索引）
- \`HTTP 403\`：仓库可能被转成私有 → 下载直链对未登录用户不可用
- \`字节数不符\`：资产被同名覆盖 → 重新生成 \`tiles/cities-index.json\`（\`scripts/gen-city-index.mjs\`）
" \
            --label "" || true
